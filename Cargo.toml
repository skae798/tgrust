[package]
name = "tgrust"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Неофициальный клиент Telegram для GNOME"
license = "GPL-3.0-only"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
anyhow = "1"
base64 = "0.22"
bytes = "1"
grammers-client = { version = "0.12", default-features = false, features = ["proxy"] }
grammers-session = "0.12"
gtk = { package = "gtk4", version = "0.10", features = ["v4_16"] }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
qrcodegen = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
url = "2.5.8"

[profile.dev]
debug = 0

[workspace]
resolver = "3"
members = ["patches/grammers-client"]
default-members = ["."]
exclude = ["patches/grammers-mtsender"]

[patch.crates-io]
grammers-client = { path = "patches/grammers-client" }
grammers-mtsender = { path = "patches/grammers-mtsender" }
