[package]
edition = "2024"
name = "grammers-mtsender"
version = "0.12.0"
authors = ["Lonami Exo <totufals@hotmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
A sender implementation using the Mobile Transport Protocol.
"""
homepage = "https://codeberg.org/Lonami/grammers"
documentation = "https://docs.rs/grammers-mtsender"
readme = "README.md"
keywords = [
    "api",
    "mtproto",
    "telegram",
    "tl",
]
categories = [
    "api-bindings",
    "network-programming",
]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/Lonami/grammers"
resolver = "2"

[features]
proxy = [
    "tokio-socks",
    "hickory-resolver",
    "url",
    "percent-encoding",
]

[lib]
name = "grammers_mtsender"
path = "src/lib.rs"

[dependencies.bytes]
version = "1.12.1"

[dependencies.grammers-mtproto]
version = "0.12.0"

[dependencies.grammers-session]
version = "0.12.0"
default-features = false

[dependencies.grammers-tl-types]
version = "0.12.0"
features = [
    "tl-mtproto",
    "deserializable-functions",
]

[dependencies.hickory-resolver]
version = "0.26.3"
optional = true

[dependencies.locate-locale]
version = "0.2.0"

[dependencies.os_info]
version = "3.15.0"
default-features = false

[dependencies.tokio]
version = "1.54.1"
features = [
    "io-util",
    "sync",
    "time",
    "net",
    "macros",
    "rt",
]
default-features = false

[dependencies.tokio-socks]
version = "0.5.3"
optional = true

[dependencies.tracing]
version = "0.1.44"

[dependencies.url]
version = "2.5.8"
optional = true

[dependencies.percent-encoding]
version = "2.3.2"
optional = true
